name: Foundation checks
on:
  pull_request:
  push:
    branches: [codex/nurani-digital-foundation]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- '*.html' sitemap.xml robots.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
